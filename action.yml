name: polyscan
description: Run Semgrep, Gitleaks, OSV-Scanner, Bandit and Checkov on a folder, and optionally scan your running app with OWASP ZAP. One report.
branding:
  icon: shield
  color: blue

inputs:
  # ---- the code
  scan-code:
    description: '"false" to skip the folder scan, for example when you only want the live-site scan.'
    default: "true"
  path:
    description: Folder to scan, relative to the repository root.
    default: "."
  exclude:
    description: Comma separated folder or file patterns to ignore.
    default: ""
  semgrep-config:
    description: Comma separated Semgrep rule packs or files. Empty uses the defaults.
    default: ""
  history:
    description: "true to also search old commits for secrets. The checkout step must use fetch-depth: 0, otherwise this check is reported as not run."
    default: "false"
  # ---- the running app
  target-url:
    description: >-
      Address of your running app, for example http://localhost:8000. When set, the app is scanned with OWASP ZAP
      (passive checks, no attacks). Only your own app: see "Uso responsabile e autorizzazione" in the README.
    default: ""
  start-command:
    description: >-
      Command that starts your app, run from the repository root, for example "docker compose up -d" or
      "python app.py". It may keep running (it is put in the background) or return when the app is up.
      It is code from YOUR workflow: never build it from untrusted data such as a pull request title.
    default: ""
  stop-command:
    description: Command that stops the app after the scan (for example "docker compose down"). Runs even if the scan fails.
    default: ""
  wait-timeout:
    description: Seconds to wait for target-url to answer after start-command.
    default: "60"
  zap-minutes:
    description: Minutes the ZAP crawler may run, 1 to 30.
    default: "1"
  auth-header-name:
    description: Header that carries the login, for pages behind a login. Authorization (default) or Cookie.
    default: Authorization
  auth-header-value:
    description: >-
      Value of that header, for example "Bearer <token>". Pass it from a repository secret (the "secrets" context of your workflow), never as plain text.
      Use a TEST account with the least privileges, never a real administrator.
    default: ""
  allow-remote:
    description: >-
      "true" to scan a target that is NOT on the runner or a private network. Say true only if you own it or have
      written authorization to test it. Anything else is refused.
    default: "false"
  # ---- risk assessment
  risk-assessment:
    description: '"true" to also write a risk register (likelihood x impact, priorities, what to do) from the reports of this run.'
    default: "false"
  risk-exposure:
    description: Who can reach the application - internet, internal or local. Used by the risk register.
    default: internet
  risk-data:
    description: What the application holds - public, internal or personal. Used by the risk register.
    default: personal
  # ---- both
  artifact-name:
    description: Name of the uploaded report. Change it if the action runs more than once in the same workflow run (names must be unique).
    default: polyscan-report
  fail-on:
    description: Fail the job if a finding has this severity or higher (info, low, medium, high, critical, none).
    default: high
  mode:
    description: auto, docker or local.
    default: auto
  strict:
    description: "true to also fail when a tool is missing, not only when it errors."
    default: "false"

outputs:
  exit-code:
    description: Exit code of the folder scan (0 ok, 1 findings, 3 a check did not run). Empty if skipped.
    value: ${{ steps.scan.outputs.exit-code }}
  dast-exit-code:
    description: Exit code of the live-site scan (same meaning). Empty if there was no target-url.
    value: ${{ steps.dast.outputs.exit-code }}
  report-dir:
    description: Folder holding the HTML, JSON and Markdown reports.
    value: ${{ steps.prepare.outputs.report-dir }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install polyscan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$ACTION_PATH" bandit==1.9.4

    - name: Prepare
      id: prepare
      shell: bash
      run: |
        report_dir="$RUNNER_TEMP/polyscan-report"
        mkdir -p "$report_dir"
        echo "report-dir=$report_dir" >> "$GITHUB_OUTPUT"

    - name: Install cargo-audit (only when the project has a Cargo.lock)
      if: ${{ inputs.scan-code == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        # Compiled from source (about 5 minutes) at a fixed version; skipped when there is no Rust lockfile.
        case "$INPUT_PATH" in -*) echo "::error::path must not start with a dash"; exit 2;; esac  # find would read it as an option
        if find "$INPUT_PATH" -name Cargo.lock -not -path '*/target/*' -not -path '*/node_modules/*' | grep -q .; then
          if command -v cargo > /dev/null; then
            cargo install cargo-audit --locked --version 0.22.2 --quiet \
              || echo "::warning::cargo-audit could not be installed: the Rust dependency check will be reported as not run"
          else
            echo "::warning::cargo is not installed: the Rust dependency check will be reported as not run"
          fi
        fi

    - name: Install the Java and PHP security tools (only for projects that have those files)
      if: ${{ inputs.scan-code == 'true' }}
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        # Fixed versions, each file checked against its sha256 before it is used. A tool that cannot be
        # installed is reported by polyscan as "not available" (never as a clean result).
        case "$INPUT_PATH" in -*) echo "::error::path must not start with a dash"; exit 2;; esac
        tools="$RUNNER_TEMP/polyscan-tools"; mkdir -p "$tools/bin"
        fetch() {  # URL, sha256, destination
          curl -fsSL --retry 3 -o "$3" "$1" && echo "$2  $3" | sha256sum -c --quiet - || { rm -f "$3"; return 1; }
        }
        if find "$INPUT_PATH" -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' | grep -q .; then
          if command -v php > /dev/null \
            && fetch https://github.com/designsecurity/progpilot/releases/download/v1.3.0/progpilot_v1.3.0.phar \
              e95979fa4a562daffbfb66012f7fab2f4ff47692d16284337a8fc48d5247d203 "$tools/progpilot.phar"; then
            printf '#!/bin/sh\nexec php "%s" "$@"\n' "$tools/progpilot.phar" > "$tools/bin/progpilot"
            chmod +x "$tools/bin/progpilot"
          else
            echo "::warning::Progpilot could not be installed (php missing or download not verified): the PHP code check will be reported as not run"
          fi
        fi
        if find "$INPUT_PATH" -name '*.java' -not -path '*/node_modules/*' | grep -q .; then
          if command -v java > /dev/null \
            && fetch https://github.com/spotbugs/spotbugs/releases/download/4.10.5/spotbugs-4.10.5.tgz \
              cce3244900cc215ccd9f5a8db29ed9468fc47824faf662f4fad005343d96007e "$tools/spotbugs.tgz" \
            && fetch https://repo1.maven.org/maven2/com/h3xstream/findsecbugs/findsecbugs-plugin/1.14.0/findsecbugs-plugin-1.14.0.jar \
              6fa340344fa433ff46c2985dab1010e8bc739f9395c983594a5240095e92abc8 "$tools/findsecbugs.jar"; then
            tar xzf "$tools/spotbugs.tgz" -C "$tools"
            cp "$tools/findsecbugs.jar" "$tools/spotbugs-4.10.5/plugin/"
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$tools/spotbugs-4.10.5/bin/spotbugs" > "$tools/bin/spotbugs"
            chmod +x "$tools/bin/spotbugs"
          else
            echo "::warning::SpotBugs could not be installed (java missing or download not verified): the Java code check will be reported as not run"
          fi
        fi
        echo "$tools/bin" >> "$GITHUB_PATH"

    - name: Scan the code
      id: scan
      if: ${{ inputs.scan-code == 'true' }}
      shell: bash
      # Inputs go through environment variables, never pasted into the script,
      # so a value like `"; rm -rf ~` cannot become a command.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_SEMGREP: ${{ inputs.semgrep-config }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_HISTORY: ${{ inputs.history }}
        REPORT_DIR: ${{ steps.prepare.outputs.report-dir }}
      run: |
        args=(scan "$INPUT_PATH" --mode "$INPUT_MODE" --fail-on "$INPUT_FAIL_ON"
              --html "$REPORT_DIR/polyscan-report.html"
              --json "$REPORT_DIR/polyscan-report.json"
              --markdown "$REPORT_DIR/polyscan-summary.md")
        IFS=',' read -ra items <<< "$INPUT_EXCLUDE"
        for item in "${items[@]}"; do [ -n "$item" ] && args+=(--exclude "$item"); done
        IFS=',' read -ra items <<< "$INPUT_SEMGREP"
        for item in "${items[@]}"; do [ -n "$item" ] && args+=(--semgrep-config "$item"); done
        [ "$INPUT_STRICT" = "true" ] && args+=(--strict)
        [ "$INPUT_HISTORY" = "true" ] && args+=(--history)
        set +e
        polyscan "${args[@]}"
        code=$?
        set -e
        [ -f "$REPORT_DIR/polyscan-summary.md" ] && cat "$REPORT_DIR/polyscan-summary.md" >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Start the app
      id: start
      if: ${{ inputs.target-url != '' && inputs.start-command != '' }}
      shell: bash
      env:
        INPUT_START: ${{ inputs.start-command }}
      run: |
        # The command runs in the background so that a server that never returns does not block
        # the job. Its exit status is written to a file, so that a start that FAILS is noticed at once.
        log="$RUNNER_TEMP/polyscan-app.log"
        status="$RUNNER_TEMP/polyscan-app.status"
        rm -f "$status"
        nohup bash -c 'bash -c "$1"; echo $? > "$2"' _ "$INPUT_START" "$status" > "$log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/polyscan-app.pid"
        echo "log=$log" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Wait for the app to answer
      if: ${{ inputs.target-url != '' }}
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target-url }}
        INPUT_WAIT: ${{ inputs.wait-timeout }}
        APP_LOG: ${{ steps.start.outputs.log }}
        APP_STATUS: ${{ steps.start.outputs.status }}
      run: |
        case "$INPUT_WAIT" in ''|*[!0-9]*) echo "::error::wait-timeout must be a whole number of seconds"; exit 2;; esac
        show_log() { [ -n "$APP_LOG" ] && [ -f "$APP_LOG" ] && { echo "--- last lines printed by the start command:"; tail -n 40 "$APP_LOG"; }; }
        deadline=$((SECONDS + INPUT_WAIT))
        while true; do
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 "$INPUT_TARGET" || true)
          if [ -n "$code" ] && [ "$code" != "000" ]; then
            echo "The app answered (HTTP $code) after about $((SECONDS - deadline + INPUT_WAIT)) seconds."
            exit 0
          fi
          if [ -n "$APP_STATUS" ] && [ -f "$APP_STATUS" ] && [ "$(cat "$APP_STATUS")" != "0" ]; then
            echo "::error::The start command failed (exit code $(cat "$APP_STATUS")) before the app answered."
            show_log
            exit 1
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::The app did not answer at $INPUT_TARGET within $INPUT_WAIT seconds."
            show_log
            exit 1
          fi
          sleep 2
        done

    - name: Scan the running app
      id: dast
      if: ${{ inputs.target-url != '' }}
      shell: bash
      env:
        INPUT_TARGET: ${{ inputs.target-url }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_ZAP_MINUTES: ${{ inputs.zap-minutes }}
        INPUT_ALLOW_REMOTE: ${{ inputs.allow-remote }}
        INPUT_AUTH_NAME: ${{ inputs.auth-header-name }}
        INPUT_AUTH_VALUE: ${{ inputs.auth-header-value }}
        REPORT_DIR: ${{ steps.prepare.outputs.report-dir }}
      run: |
        args=(dast "$INPUT_TARGET" --mode "$INPUT_MODE" --fail-on "$INPUT_FAIL_ON" --minutes "$INPUT_ZAP_MINUTES"
              --html "$REPORT_DIR/polyscan-dast-report.html"
              --json "$REPORT_DIR/polyscan-dast-report.json"
              --markdown "$REPORT_DIR/polyscan-dast-summary.md")
        [ "$INPUT_STRICT" = "true" ] && args+=(--strict)
        [ "$INPUT_ALLOW_REMOTE" = "true" ] && args+=(--allow-remote)
        # The VALUE is read from the environment variable by polyscan itself; it is never put on a command line.
        [ -n "$INPUT_AUTH_VALUE" ] && args+=(--auth-header-env INPUT_AUTH_VALUE --auth-header-name "$INPUT_AUTH_NAME")
        set +e
        polyscan "${args[@]}"
        code=$?
        set -e
        [ -f "$REPORT_DIR/polyscan-dast-summary.md" ] && cat "$REPORT_DIR/polyscan-dast-summary.md" >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Risk assessment
      id: risk
      if: ${{ always() && inputs.risk-assessment == 'true' }}
      shell: bash
      env:
        INPUT_EXPOSURE: ${{ inputs.risk-exposure }}
        INPUT_DATA: ${{ inputs.risk-data }}
        REPORT_DIR: ${{ steps.prepare.outputs.report-dir }}
      run: |
        args=(risk --exposure "$INPUT_EXPOSURE" --data "$INPUT_DATA"
              --html "$REPORT_DIR/polyscan-risk-report.html"
              --json "$REPORT_DIR/polyscan-risk-report.json"
              --markdown "$REPORT_DIR/polyscan-risk-summary.md")
        reports=()
        for name in polyscan-report.json polyscan-dast-report.json; do
          [ -f "$REPORT_DIR/$name" ] && reports+=("$REPORT_DIR/$name")
        done
        if [ ${#reports[@]} -eq 0 ]; then
          echo "::warning::risk-assessment: there is no scan report to read"
          exit 0
        fi
        set +e
        polyscan "${args[@]}" "${reports[@]}"
        code=$?
        set -e
        [ -f "$REPORT_DIR/polyscan-risk-summary.md" ] && cat "$REPORT_DIR/polyscan-risk-summary.md" >> "$GITHUB_STEP_SUMMARY"
        # 1 and 3 only repeat what the scan steps already report (findings, a check that did not run); 2 is a real error.
        [ "$code" = "2" ] && exit 2
        exit 0

    - name: Stop the app
      # Always: a failed scan must not leave the app running (matters on self-hosted runners).
      if: ${{ always() && inputs.target-url != '' }}
      shell: bash
      env:
        INPUT_STOP: ${{ inputs.stop-command }}
      run: |
        pidfile="$RUNNER_TEMP/polyscan-app.pid"
        if [ -f "$pidfile" ]; then
          pid=$(cat "$pidfile")
          pkill -TERM -P "$pid" 2>/dev/null || true
          kill -TERM "$pid" 2>/dev/null || true
        fi
        if [ -n "$INPUT_STOP" ]; then
          bash -c "$INPUT_STOP" || echo "::warning::The stop command failed."
        fi

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.prepare.outputs.report-dir }}
        if-no-files-found: warn

    - name: Fail if polyscan failed
      shell: bash
      env:
        SCAN_CODE: ${{ steps.scan.outputs.exit-code }}
        DAST_CODE: ${{ steps.dast.outputs.exit-code }}
      run: |
        for pair in "code scan:$SCAN_CODE" "live-site scan:$DAST_CODE"; do
          name=${pair%%:*}; code=${pair#*:}
          if [ -n "$code" ] && [ "$code" != "0" ]; then
            echo "polyscan ($name) exited with code $code (1 = findings, 2 = bad input or refused target, 3 = a check did not run)"
            exit "$code"
          fi
        done
