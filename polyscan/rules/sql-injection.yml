# polyscan rules: SQL built from text and then executed (CWE-89).
#
# A "source" is text assembled by hand (concatenation, interpolation, format)
# that contains SQL. A "sink" is a call that runs SQL. If a source reaches a
# sink, the query is not parameterized. Taint tracking follows the value
# through variables inside one function.
#
# Notes for editing: metavariable-regex matches from the START of the text, so
# its pattern begins with ".*"; pattern-regex searches inside the text.
rules:
  - id: polyscan-sql-python
    languages: [python]
    severity: ERROR
    mode: taint
    message: >-
      SQL query assembled by hand (concatenation, f-string, % or .format) and then executed. If any part comes from a user this is a SQL injection. Pass values as parameters: cursor.execute("... WHERE id = %s", (value,)).
    metadata: {category: security, cwe: "CWE-89: SQL Injection", owasp: "A03:2021 Injection"}
    pattern-sources:
      - patterns:
          - pattern: '$A + $B'
          - pattern-not: '"..." + "..."'
          - metavariable-regex:
              metavariable: $A
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern: '$A + $B'
          - pattern-not: '"..." + "..."'
          - metavariable-regex:
              metavariable: $B
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern-regex: '(?is)\b(?:[rR]?[fF]|[fF][rR])(\"\"\"|''''''|\"|'')(?=(?:(?!\1).)*?\{)(?=(?:(?!\1).)*?\b(?:select\b(?:(?!\1).)+?\bfrom|insert\s+into|update\b(?:(?!\1).)+?\bset|delete\s+from|drop\s+(?:table|database)|alter\s+table|truncate\s+table|union\s+select)\b)(?:(?!\1).)*\1'
      - patterns:
          - pattern: '$A % $B'
          - metavariable-regex:
              metavariable: $A
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern: '$A.format(...)'
          - metavariable-regex:
              metavariable: $A
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$DB.execute($SQL, ...)'
              - pattern: '$DB.executemany($SQL, ...)'
              - pattern: '$DB.executescript($SQL, ...)'
              - pattern: '$DB.raw($SQL, ...)'
              - pattern: '$DB.extra(..., $SQL, ...)'
              - pattern: 'text($SQL)'
              - pattern: 'RawSQL($SQL, ...)'
          - focus-metavariable: $SQL

  - id: polyscan-sql-javascript
    languages: [javascript, typescript]
    severity: ERROR
    mode: taint
    message: >-
      SQL query assembled by hand (template string or +) and then executed. If any part comes from a user this is a SQL injection. Use placeholders: db.query("SELECT * FROM t WHERE id = ?", [value]).
    metadata: {category: security, cwe: "CWE-89: SQL Injection", owasp: "A03:2021 Injection"}
    pattern-sources:
      - patterns:
          - pattern: '$A + $B'
          - pattern-not: '"..." + "..."'
          - metavariable-regex:
              metavariable: $A
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern: '$A + $B'
          - pattern-not: '"..." + "..."'
          - metavariable-regex:
              metavariable: $B
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern-regex: '(?is)`(?=[^`]*?\$\{)(?=[^`]*?\b(?:select\b[^`]+?\bfrom|insert\s+into|update\b[^`]+?\bset|delete\s+from|drop\s+(?:table|database)|alter\s+table|truncate\s+table|union\s+select)\b)[^`]*`'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$DB.query($SQL, ...)'
              - pattern: '$DB.execute($SQL, ...)'
              - pattern: '$DB.raw($SQL, ...)'
              - pattern: '$DB.run($SQL, ...)'
              - pattern: '$DB.all($SQL, ...)'
              - pattern: '$DB.each($SQL, ...)'
              - pattern: '$DB.prepare($SQL)'
          - focus-metavariable: $SQL

  - id: polyscan-sql-java
    languages: [java]
    severity: ERROR
    mode: taint
    message: >-
      SQL query assembled by hand (+ or String.format) and then executed. If any part comes from a user this is a SQL injection. Use a PreparedStatement with ? placeholders and setString/setInt.
    metadata: {category: security, cwe: "CWE-89: SQL Injection", owasp: "A03:2021 Injection"}
    pattern-sources:
      - patterns:
          - pattern: '$A + $B'
          - pattern-not: '"..." + "..."'
          - metavariable-regex:
              metavariable: $A
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern: '$A + $B'
          - pattern-not: '"..." + "..."'
          - metavariable-regex:
              metavariable: $B
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern-either:
              - pattern: 'String.format($F, ...)'
              - pattern: '$F.formatted(...)'
          - metavariable-regex:
              metavariable: $F
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$S.executeQuery($SQL, ...)'
              - pattern: '$S.executeUpdate($SQL, ...)'
              - pattern: '$S.execute($SQL, ...)'
              - pattern: '$S.addBatch($SQL)'
              - pattern: '$C.prepareStatement($SQL, ...)'
              - pattern: '$C.prepareCall($SQL, ...)'
              - pattern: '$EM.createQuery($SQL, ...)'
              - pattern: '$EM.createNativeQuery($SQL, ...)'
              - pattern: '$J.query($SQL, ...)'
              - pattern: '$J.queryForObject($SQL, ...)'
              - pattern: '$J.queryForList($SQL, ...)'
              - pattern: '$J.update($SQL, ...)'
          - focus-metavariable: $SQL

  - id: polyscan-sql-php
    languages: [php]
    severity: ERROR
    mode: taint
    message: >-
      SQL query assembled by hand (. or string interpolation) and then executed. If any part comes from a user this is a SQL injection. Use prepared statements: $stmt = $pdo->prepare("... WHERE id = ?"); $stmt->execute([$id]).
    metadata: {category: security, cwe: "CWE-89: SQL Injection", owasp: "A03:2021 Injection"}
    pattern-sources:
      - patterns:
          - pattern: '$A . $B'
          - pattern-not: '"..." . "..."'
          - metavariable-regex:
              metavariable: $A
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern: '$A . $B'
          - pattern-not: '"..." . "..."'
          - metavariable-regex:
              metavariable: $B
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern-either:
              - pattern: 'sprintf($F, ...)'
          - metavariable-regex:
              metavariable: $F
              regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'
      - patterns:
          - pattern-regex: '(?is)"(?=[^"]*?\$[A-Za-z_{])(?=[^"]*?\b(?:select\b[^"]+?\bfrom|insert\s+into|update\b[^"]+?\bset|delete\s+from|drop\s+(?:table|database)|alter\s+table|truncate\s+table|union\s+select)\b)[^"]*"'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'mysqli_query($C, $SQL, ...)'
              - pattern: 'mysql_query($SQL, ...)'
              - pattern: 'pg_query($C, $SQL)'
              - pattern: '$DB->query($SQL, ...)'
              - pattern: '$DB->exec($SQL)'
              - pattern: '$DB->prepare($SQL, ...)'
              - pattern: '$DB->real_query($SQL)'
              - pattern: '$DB->get_results($SQL, ...)'
              - pattern: '$DB->get_row($SQL, ...)'
          - focus-metavariable: $SQL

  # Rust does not use taint mode: Semgrep's taint tracking misses calls whose second
  # argument is an array or params![...] (the usual rusqlite style). This rule matches
  # the text shape instead and is reported on the line where the query is built.
  - id: polyscan-sql-rust
    languages: [rust]
    severity: ERROR
    message: >-
      SQL query assembled with format! and then executed. If any part comes from a user this is a SQL injection. Use bound parameters: sqlx::query("... WHERE id = ?").bind(id), or params![id] with rusqlite.
    metadata: {category: security, cwe: "CWE-89: SQL Injection", owasp: "A03:2021 Injection"}
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: |
                  let $Q = format!($F, ...);
                  ...
                  $C.$M(&$Q, ...)
              - pattern: |
                  let $Q = format!($F, ...);
                  ...
                  $C.$M($Q, ...)
          - metavariable-regex: {metavariable: $F, regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'}
          - metavariable-regex: {metavariable: $M, regex: '(execute|query|query_one|query_row|query_opt|prepare|batch_execute|execute_batch)'}
      - patterns:
          - pattern-either:
              - pattern: |
                  let $Q = format!($F, ...);
                  ...
                  $P(&$Q, ...)
              - pattern: |
                  let $Q = format!($F, ...);
                  ...
                  $P($Q, ...)
          - metavariable-regex: {metavariable: $F, regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'}
          - metavariable-regex: {metavariable: $P, regex: '(sqlx::query|sqlx::query_as|sqlx::query_scalar|diesel::sql_query|sql_query)'}
      - patterns:
          - pattern-either:
              - pattern: |
                  $C.$M(&format!($F, ...), ...)
              - pattern: |
                  $C.$M(format!($F, ...), ...)
          - metavariable-regex: {metavariable: $F, regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'}
          - metavariable-regex: {metavariable: $M, regex: '(execute|query|query_one|query_row|query_opt|prepare|batch_execute|execute_batch)'}
      - patterns:
          - pattern-either:
              - pattern: |
                  $P(&format!($F, ...), ...)
              - pattern: |
                  $P(format!($F, ...), ...)
          - metavariable-regex: {metavariable: $F, regex: '(?is).*\b(select\b.+\bfrom|insert\s+into|update\b.+\bset|delete\s+from|drop\s+(table|database)|alter\s+table|truncate\s+table|union\s+select)\b'}
          - metavariable-regex: {metavariable: $P, regex: '(sqlx::query|sqlx::query_as|sqlx::query_scalar|diesel::sql_query|sql_query)'}
