name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v

  # The built-in SQL injection rules are tested with the real Semgrep: every
  # "ruleid" example must be found and every "ok" example must stay quiet.
  sql-rules:
    name: Built-in rules (SQL, Compose, Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" semgrep==1.181.1
      - run: python -m pytest -v tests/test_sql_rules.py tests/test_config_rules.py

  # polyscan scans its own code and its whole git history. The examples contain
  # deliberate problems and the test fixtures contain saved scanner output, so
  # both are excluded.
  dogfood:
    name: Scan this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the whole history, so old commits can be searched for secrets
      - id: scan
        uses: ./
        with:
          exclude: examples,tests
          fail-on: high
          history: "true"
      - name: Show what was found (annotations are the only CI output that can be read afterwards)
        if: always()
        env:
          REPORT_DIR: ${{ steps.scan.outputs.report-dir }}
        run: |
          python - <<'EOF3'
          import json, os
          data = json.load(open(os.path.join(os.environ["REPORT_DIR"], "polyscan-report.json")))
          print("::notice title=dogfood-tools::" + str({t["name"]: (t["status"], t["findings"]) for t in data["tools"]}))
          high = [f for f in data["findings"] if f["severity"] in ("high", "critical")]
          for f in high[:10]:
              print("::warning title=dogfood-high::" + f'{f["tool"]} {f["rule"]} {f["file"]}:{f["line"]} {f["message"]}'[:400])
          EOF3
      # A check that did not run does not fail the job by itself, so look at the report.
      - name: Every check ran, history included
        env:
          REPORT_DIR: ${{ steps.scan.outputs.report-dir }}
        run: |
          python - <<'EOF2'
          import json, os, sys
          data = json.load(open(os.path.join(os.environ["REPORT_DIR"], "polyscan-report.json")))
          status = {t["name"]: (t["status"], t["detail"]) for t in data["tools"]}
          print(status)
          problems = [f"{n}: {s} {d}" for n, (s, d) in status.items() if s in ("error", "unavailable")]
          if status.get("gitleaks-history", ("", ""))[0] != "ok":
              problems.append("gitleaks-history did not run: " + str(status.get("gitleaks-history")))
          if problems:
              print("PROBLEMS:", *problems, sep="\n  ")
              print("::error title=problems::" + " | ".join(problems)[:3500])
              sys.exit(1)
          EOF2

  # End-to-end check on GitHub, where Docker and the vulnerability databases
  # are reachable: every tool must run and the demo projects must be flagged.
  demo-scan:
    name: Demo projects are flagged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile the Java demo (SpotBugs reads compiled classes, not source)
        run: |
          mkdir -p examples/vulnerable-demo/java/target/classes
          javac -d examples/vulnerable-demo/java/target/classes examples/vulnerable-demo/java/src/App.java
      - id: scan
        uses: ./
        with:
          path: examples/vulnerable-demo
          fail-on: none
          risk-assessment: "true"
      - name: Check the report
        env:
          REPORT_DIR: ${{ steps.scan.outputs.report-dir }}
        run: |
          python - <<'EOF'
          import json, os, sys
          data = json.load(open(os.path.join(os.environ["REPORT_DIR"], "polyscan-report.json")))
          tools = {t["name"]: t for t in data["tools"]}
          print({k: (v["status"], v["findings"]) for k, v in tools.items()})
          print("::notice title=tools::" + str({k: (v["status"], v["findings"]) for k, v in tools.items()}))
          problems = []
          for name, t in tools.items():
              if t["status"] != "ok":
                  problems.append(f'{name}: {t["status"]} {t["detail"]}')
              elif t["findings"] == 0:
                  problems.append(f"{name}: ran but found nothing in the demo projects")
          langs = set(data["languages"])
          if langs != {"java", "javascript", "php", "python", "rust", "docker"}:
              problems.append(f"languages detected: {sorted(langs)}")
          risk = json.load(open(os.path.join(os.environ["REPORT_DIR"], "polyscan-risk-report.json")))
          print({"risk-summary": risk["summary"], "gaps": risk["coverage_gaps"]})
          if risk["kind"] != "risk-assessment" or not risk["risks"] or not risk["risks"][0]["reasons"]:
              problems.append("the risk register is empty or has no reasons")
          if sum(risk["summary"].values()) != len(risk["risks"]):
              problems.append("risk summary does not match the register")
          for name in ("polyscan-risk-report.html", "polyscan-risk-summary.md"):
              if not os.path.getsize(os.path.join(os.environ["REPORT_DIR"], name)):
                  problems.append(f"{name} is empty")
          if problems:
              print("PROBLEMS:", *problems, sep="\n  ")
              print("::error title=problems::" + " | ".join(problems)[:3500])
              sys.exit(1)
          EOF

  # Live-site scan with the real ZAP in Docker, on a demo site started here.
  dast-demo:
    name: Live site scan (ZAP) on the demo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Start the demo site
        run: |
          # 0.0.0.0: on Linux the ZAP container reaches the host through the docker bridge, not through 127.0.0.1
          python examples/vulnerable-web/server.py --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          curl -fsI http://127.0.0.1:8000/ | head -1
      - name: Scan the running site
        run: polyscan dast http://localhost:8000 --json zap-report.json --fail-on none
      - name: ZAP ran and found the planted weaknesses
        run: |
          python - <<'EOF2'
          import json, re, sys
          data = json.load(open("zap-report.json"))
          zap = next(t for t in data["tools"] if t["name"] == "zap")
          # drop only the "(12 URLs)" suffix: names such as "... Policy (CSP) Header ..." contain parentheses too
          rules = sorted({re.sub(r" \(\d+ URLs\)$", "", f["message"]) for f in data["findings"]})
          files = sorted({f["file"] for f in data["findings"]})
          # The summary goes to an annotation too, so a failure can be understood without the full log.
          print(f"::notice title=dast-summary::kind={data['kind']} notes={data['notes']} zap={zap['status']} {zap['detail'][:200]} rules={rules} files={files[:6]}")
          problems = []
          if data["kind"] != "site" or data["notes"]:
              problems.append(f"a local site must not carry the remote-target note: {data['notes']}")
          if zap["status"] != "ok":
              problems.append(f"zap status: {zap}")
          for expected in ("Content Security Policy (CSP) Header Not Set", "Cookie No HttpOnly Flag", "Absence of Anti-CSRF Tokens"):
              if expected not in rules:
                  problems.append(f"ZAP did not report: {expected}")
          wrong = [f for f in files if not f.startswith("http://localhost:8000")]
          if wrong:
              problems.append(f"addresses other than the one typed: {wrong[:5]}")
          if problems:
              print("::error title=dast-check::" + " | ".join(problems)[:1500])
              sys.exit(1)
          EOF2
      - name: With a login, the page behind it is scanned too
        env:
          DEMO_TOKEN: Bearer demo-token-123
        run: |
          polyscan dast http://localhost:8000 --json auth.json --fail-on none --auth-header-env DEMO_TOKEN > auth.out 2>&1 || true
          python - <<'EOF2'
          import json, sys
          def seen(path):
              data = json.load(open(path))
              return data, [(f["message"], f["file"]) for f in data["findings"] if "X-Powered-By" in f["message"]]
          anon_data, anon = seen("zap-report.json")
          auth_data, auth = seen("auth.json")
          zap = next(t for t in auth_data["tools"] if t["name"] == "zap")
          print(f"::notice title=auth-summary::zap={zap['status']} notes={[n[:40] for n in auth_data['notes']]} anon={anon} auth={auth} rules={sorted({f['message'] for f in auth_data['findings']})[:12]}")
          problems = []
          if zap["status"] != "ok": problems.append(f"zap: {zap}")
          if anon: problems.append(f"anonymous scan saw the protected page: {anon}")
          if not any(f.endswith("/admin") for _, f in auth): problems.append("authenticated scan did not reach /admin")
          if not any("AUTHENTICATED" in n for n in auth_data["notes"]): problems.append("no AUTHENTICATED note")
          blob = open("auth.json").read() + open("auth.out").read()
          if "demo-token-123" in blob: problems.append("THE SECRET APPEARS IN THE OUTPUT")
          if problems:
              print("::error title=auth-check::" + " | ".join(problems)[:1500]); sys.exit(1)
          EOF2
      - name: A site that does not answer is an error, never a clean result
        run: |
          set +e
          polyscan dast http://localhost:9 --json closed.json --fail-on none
          code=$?
          set -e
          echo "exit code: $code"
          [ "$code" = "3" ]
          python - <<'EOF2'
          import json
          zap = next(t for t in json.load(open("closed.json"))["tools"] if t["name"] == "zap")
          print(zap)
          assert zap["status"] == "error", zap
          EOF2
      - name: Other people's sites are refused before anything is sent
        run: |
          set +e
          polyscan dast http://93.184.216.34/ 2> refusal.txt
          code=$?
          set -e
          cat refusal.txt
          [ "$code" = "2" ]
          grep -q -- "--allow-remote" refusal.txt


  action-dast:
    name: The action itself - start app, scan, stop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the action on the demo site
        id: good
        uses: ./
        with:
          scan-code: "false"
          target-url: http://localhost:8000
          start-command: python examples/vulnerable-web/server.py --host 0.0.0.0 --port 8000
          fail-on: none
      - name: The live-site report exists, and the app was stopped
        if: always()
        env:
          REPORT_DIR: ${{ steps.good.outputs.report-dir }}
          DAST_CODE: ${{ steps.good.outputs.dast-exit-code }}
        run: |
          ls -l "$REPORT_DIR"
          python - <<'EOF2'
          import json, os, subprocess, sys
          problems = []
          path = os.path.join(os.environ["REPORT_DIR"], "polyscan-dast-report.json")
          try:
              data = json.load(open(path))
              zap = next(t for t in data["tools"] if t["name"] == "zap")
              print(f"::notice title=action-dast::exit={os.environ['DAST_CODE']} zap={zap['status']} findings={len(data['findings'])}")
              if zap["status"] != "ok" or not data["findings"]:
                  problems.append(f"zap={zap}")
          except Exception as e:
              problems.append(f"report unreadable: {e!r}")
          if os.environ["DAST_CODE"] != "0":
              problems.append("dast-exit-code=" + os.environ["DAST_CODE"])
          # stop step: nothing may still listen on 8000
          if subprocess.run(["curl", "-s", "-o", "/dev/null", "--max-time", "3", "http://127.0.0.1:8000/"]).returncode == 0:
              problems.append("the app still answers after the stop step")
          if problems:
              print("::error title=action-dast-check::" + " | ".join(problems)[:1500])
              sys.exit(1)
          EOF2
      - name: A start command that fails must fail the job at once
        id: badstart
        continue-on-error: true
        uses: ./
        with:
          scan-code: "false"
          target-url: http://localhost:8001
          start-command: echo "boom" >&2; exit 7
          artifact-name: report-badstart
          wait-timeout: "30"
      - name: An app that never answers must fail the job after the timeout
        id: silent
        continue-on-error: true
        uses: ./
        with:
          scan-code: "false"
          target-url: http://localhost:8002
          start-command: sleep 300
          artifact-name: report-silent
          wait-timeout: "6"
      - name: Both negative cases failed, as they must
        env:
          BAD: ${{ steps.badstart.outcome }}
          SILENT: ${{ steps.silent.outcome }}
          BAD_DAST: ${{ steps.badstart.outputs.dast-exit-code }}
          SILENT_DAST: ${{ steps.silent.outputs.dast-exit-code }}
        run: |
          echo "::notice title=negative-cases::badstart=$BAD silent=$SILENT dast ran: '$BAD_DAST' '$SILENT_DAST'"
          [ "$BAD" = "failure" ] && [ "$SILENT" = "failure" ]
          # ZAP must not even have started when the app never came up
          [ -z "$BAD_DAST" ] && [ -z "$SILENT_DAST" ]

  ports-check:
    name: Listening ports (ss) on a real Linux machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Open a fake database port on every interface, and a fake Redis on loopback only
        run: |
          mkdir -p /tmp/srv
          (cd /tmp/srv && nohup python -m http.server 5432 --bind 0.0.0.0 > /dev/null 2>&1 &)
          (cd /tmp/srv && nohup python -m http.server 6379 --bind 127.0.0.1 > /dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:5432/ && curl -s -o /dev/null http://127.0.0.1:6379/ && break; sleep 1; done
          # A short sample of the REAL output of ss, kept as a test fixture afterwards.
          sample=$(ss -H -tulnp | head -14 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=ss-sample::$sample"
      - name: polyscan ports reports the first and not the second
        run: |
          set +e
          polyscan ports --json ports.json --markdown ports.md --fail-on none
          code=$?
          set -e
          echo "exit code: $code"
          python - <<'EOF2'
          import json, sys
          data = json.load(open("ports.json"))
          ss = next(t for t in data["tools"] if t["name"] == "ss")
          files = sorted(f["file"] for f in data["findings"])
          rules = sorted({f["rule"] for f in data["findings"]})
          print(f"::notice title=ports-summary::kind={data['kind']} ss={ss['status']} {ss['detail']} findings={files} rules={rules}")
          problems = []
          if data["kind"] != "host" or ss["status"] != "ok": problems.append(f"status: {ss}")
          if "tcp/5432" not in files: problems.append("the database port open on every interface was not reported")
          pg = [f for f in data["findings"] if f["file"] == "tcp/5432"]
          if pg and pg[0]["severity"] != "high": problems.append(f"severity: {pg[0]['severity']}")
          if "tcp/6379" in files: problems.append("a port bound to 127.0.0.1 only must not be reported")
          if problems:
              print("::error title=ports-check::" + " | ".join(problems)[:1500]); sys.exit(1)
          EOF2
      - name: The port is expected, so it is silent; the risk register reads the result
        run: |
          polyscan ports --expect 22,80,443,5432 --json expected.json --fail-on none > /dev/null
          python - <<'EOF2'
          import json
          files = [f["file"] for f in json.load(open("expected.json"))["findings"]]
          assert "tcp/5432" not in files, files
          EOF2
          polyscan risk ports.json --json risk.json > /dev/null || true
          python - <<'EOF2'
          import json
          risk = json.load(open("risk.json"))
          ids = [r["rule"] for r in risk["risks"]]
          print("::notice title=ports-risk::" + str(ids))
          assert "exposed-postgresql" in ids, ids
          EOF2
