# Manual workflow: shows the newest stable version, commit and image digest of
# everything polyscan pins, so that an update can be reviewed by a person.
# It changes nothing. Start it from the Actions tab ("Run workflow").
name: show-latest-pins
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/show-latest-pins.yml]  # also runs when this file changes, so a new tool can be added without a click
permissions:
  contents: read
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - name: Latest stable tag and commit of each action
        run: |
          echo "### GitHub Actions" >> "$GITHUB_STEP_SUMMARY"
          for repo in actions/checkout actions/setup-python actions/upload-artifact; do
            tag=$(git ls-remote --tags "https://github.com/$repo" 'refs/tags/v*' \
              | awk '{print $2}' | sed 's/\^{}$//' | sort -u \
              | grep -E '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's#refs/tags/##' | sort -V | tail -1)
            sha=$(git ls-remote "https://github.com/$repo" "refs/tags/$tag^{}" | awk '{print $1}')
            [ -z "$sha" ] && sha=$(git ls-remote "https://github.com/$repo" "refs/tags/$tag" | awk '{print $1}')
            echo "::notice title=action::$repo $tag $sha"
            echo "- \`$repo@$sha # $tag\`" >> "$GITHUB_STEP_SUMMARY"
          done
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Version and digest of each image
        run: |
          echo "### Docker images" >> "$GITHUB_STEP_SUMMARY"
          check() {  # image, then the command that prints its version
            img="$1"; shift
            docker pull -q "$img" >/dev/null
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$img")
            version=$(docker run --rm "$img" "$@" 2>&1 | head -3 | tr '\n' ' ')
            echo "::notice title=image::$img | $digest | $version"
            echo "- \`$digest\` — $version" >> "$GITHUB_STEP_SUMMARY"
          }
          check semgrep/semgrep:latest semgrep --version
          check zricethezav/gitleaks:latest version
          check ghcr.io/google/osv-scanner:latest --version
          check bridgecrew/checkov:latest --version
          check ghcr.io/zaproxy/zaproxy:stable zap.sh -version
          check ghcr.io/aquasecurity/trivy:latest --version
  trivy-sample:
    # Prints a SHORT sample of real Trivy output (2 vulnerabilities), to be saved as a test fixture.
    runs-on: ubuntu-latest
    steps:
      - name: Run the pinned Trivy on the demo base image
        run: |
          docker run --rm ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --quiet --format json --scanners vuln --severity HIGH,CRITICAL --image-src remote python:3.9.0 > trivy.json
          python3 - <<'PY'
          import json
          d = json.load(open("trivy.json"))
          total = sum(len(r.get("Vulnerabilities") or []) for r in d.get("Results") or [])
          keep = ("VulnerabilityID", "PkgID", "PkgName", "InstalledVersion", "FixedVersion", "Status", "Title", "PrimaryURL", "Severity")
          out = {k: d.get(k) for k in ("SchemaVersion", "ArtifactName", "ArtifactType")}
          out["Results"] = []
          for r in d.get("Results") or []:
              vulns = [{k: v[k] for k in keep if k in v} for v in (r.get("Vulnerabilities") or [])[:2]]
              if vulns:
                  out["Results"].append({"Target": r.get("Target"), "Class": r.get("Class"), "Type": r.get("Type"), "Vulnerabilities": vulns})
          d = {**out, "Results": out["Results"][:1]}
          print("::notice title=trivy-total::" + str(total) + " vulnerabilities in python:3.9.0")
          print("::notice title=trivy-sample::" + json.dumps(d, separators=(",", ":")))
          PY
  php-sample:
    # Second look at the PHP tools: the full Psalm requirement message, Progpilot, and composer audit exit codes.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PHP tools
        run: |
          set +e
          php -v | head -1
          ps=$(gh api repos/vimeo/psalm/releases/latest --jq .tag_name)
          curl -fsSL -o psalm.phar "https://github.com/vimeo/psalm/releases/download/$ps/psalm.phar"
          php psalm.phar --version > psalm.err 2>&1
          echo "::notice title=psalm-requirement::$(grep -A3 'mandatory requirements' psalm.err | tr '\n' ' ' | cut -c1-700)"
          pp=$(gh api repos/designsecurity/progpilot/releases/latest --jq .tag_name)
          echo "::notice title=progpilot-version::$pp"
          gh release download "$pp" -R designsecurity/progpilot -p 'progpilot*.phar' -O progpilot.phar
          ls -la progpilot.phar
          echo "::notice title=progpilot-sha256::$(sha256sum progpilot.phar | cut -d' ' -f1)"
          php progpilot.phar --help 2>&1 | head -c 700 | tr '\n' ' '
          echo
          php progpilot.phar examples/vulnerable-demo/php/index.php > pp.json 2> pp.err
          echo "progpilot exit=$?"
          echo "::notice title=progpilot-json::$(head -c 3000 pp.json | tr '\n' ' ')"
          echo "::notice title=progpilot-err::$(head -c 400 pp.err | tr '\n' ' ')"
          cd examples/vulnerable-demo/php
          composer audit --format=json --locked > /tmp/ca.json 2>/tmp/ca.err
          echo "::notice title=composer-audit-exit::$?"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/ca.json"))
          print("::notice title=composer-keys::" + str(list(d)) + " abandoned=" + json.dumps(d.get("abandoned")))
          adv = d["advisories"]["guzzlehttp/guzzle"]
          print("::notice title=composer-count::%d advisories; keys=%s" % (len(adv), sorted(adv[0])))
          print("::notice title=composer-sample::" + json.dumps({"advisories": {"guzzlehttp/guzzle": adv[:2]}, "abandoned": d.get("abandoned", {})}, separators=(",", ":")))
          PY
          rm composer.lock
          composer audit --format=json --locked > /tmp/ca2.json 2>/tmp/ca2.err
          echo "::notice title=composer-nolock::exit=$? out=$(head -c 300 /tmp/ca2.json | tr '\n' ' ') err=$(head -c 400 /tmp/ca2.err | tr '\n' ' ')"
  java-php-sample:
    # Newest SpotBugs, Find Security Bugs and Psalm with their sha256, and REAL output on the demo projects
    # (to be saved as test fixtures). Also tries `composer audit` on the demo lock file.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SpotBugs and Find Security Bugs
        run: |
          set +e
          sb=$(gh api repos/spotbugs/spotbugs/releases/latest --jq .tag_name)
          echo "::notice title=spotbugs-version::$sb"
          curl -fsSL -o spotbugs.tgz "https://github.com/spotbugs/spotbugs/releases/download/$sb/spotbugs-$sb.tgz"
          echo "::notice title=spotbugs-sha256::$(sha256sum spotbugs.tgz | cut -d' ' -f1) size $(stat -c%s spotbugs.tgz)"
          tar xzf spotbugs.tgz
          fsb=$(curl -fsSL https://repo1.maven.org/maven2/com/h3xstream/findsecbugs/findsecbugs-plugin/maven-metadata.xml | grep -o '<release>[^<]*' | cut -d'>' -f2)
          echo "::notice title=findsecbugs-version::$fsb"
          curl -fsSL -o findsecbugs.jar "https://repo1.maven.org/maven2/com/h3xstream/findsecbugs/findsecbugs-plugin/$fsb/findsecbugs-plugin-$fsb.jar"
          echo "::notice title=findsecbugs-sha256::$(sha256sum findsecbugs.jar | cut -d' ' -f1)"
          mkdir -p classes && javac -d classes examples/vulnerable-demo/java/src/App.java
          java -version 2>&1 | head -1
          "spotbugs-$sb/bin/spotbugs" -textui -pluginList "$PWD/findsecbugs.jar" -xml:withMessages -effort:max -low -output sb.xml classes
          echo "exit=$?"
          python3 - <<'PY'
          import re
          t = open("sb.xml").read()
          bugs = re.findall(r"<BugInstance.*?</BugInstance>", t, re.S)
          print("::notice title=spotbugs-count::%d bugs, %d chars" % (len(bugs), len(t)))
          short = [re.sub(r"\s+", " ", b)[:1100] for b in bugs[:2]]
          print("::notice title=spotbugs-sample::" + "@@".join(short))
          print("::notice title=spotbugs-head::" + re.sub(r"\s+", " ", t[:600]))
          PY
      - name: Psalm and composer audit
        run: |
          set +e
          php -v | head -1; composer --version
          ps=$(gh api repos/vimeo/psalm/releases/latest --jq .tag_name)
          echo "::notice title=psalm-version::$ps"
          curl -fsSL -o psalm.phar "https://github.com/vimeo/psalm/releases/download/$ps/psalm.phar"
          echo "::notice title=psalm-sha256::$(sha256sum psalm.phar | cut -d' ' -f1) size $(stat -c%s psalm.phar)"
          mkdir -p ptest && cp examples/vulnerable-demo/php/index.php ptest/
          cat > psalm-test.xml <<XML
          <?xml version="1.0"?>
          <psalm errorLevel="8" resolveFromConfigFile="false" findUnusedCode="false">
            <projectFiles><directory name="$PWD/ptest"/></projectFiles>
          </psalm>
          XML
          php psalm.phar --config=psalm-test.xml --taint-analysis --output-format=json --no-progress --no-cache > psalm.json 2> psalm.err
          echo "psalm exit=$?"
          echo "::notice title=psalm-err::$(head -c 600 psalm.err | tr '\n' ' ')"
          echo "::notice title=psalm-json::$(head -c 3000 psalm.json | tr '\n' ' ')"
          cd examples/vulnerable-demo/php
          composer audit --format=json --locked > ../../../ca.json 2> ../../../ca.err
          echo "composer audit exit=$?"
          echo "::notice title=composer-audit-err::$(head -c 600 ../../../ca.err | tr '\n' ' ')"
          echo "::notice title=composer-audit::$(head -c 3000 ../../../ca.json | tr '\n' ' ')"
